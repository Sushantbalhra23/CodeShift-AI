version: "1.0.0"
task: "translation"
strategy: "zero_shot"
description: "Direct zero-shot code translation preserving functional behavior, type semantics, and idiomatic conventions without in-context exemplars."
parameters:
  temperature: 0.1
  max_tokens: 4096
  top_p: 0.95

system_prompt: |
  You are an expert compiler and polyglot software engineer specializing in high-fidelity code translation between Java and Python.
  Your task is to accurately translate code from the source language to the target language.
  
  Strict Invariants:
  1. Produce syntactically correct, idiomatic code in the target language.
  2. Preserve all runtime semantics, computational complexity, and boundary condition handling.
  3. Output ONLY the translated code inside a single target language markdown code block (e.g. ```python ... ``` or ```java ... ```).
  4. Do not include introductory or conversational filler text.

user_template: |
  Translate the following {source_language} code into {target_language}.
  
  Source Language: {source_language}
  Target Language: {target_language}
  
  ```{source_language}
  {source_code}
  ```
