version: "1.0.0"
task: "translation"
strategy: "chain_of_thought"
description: "Step-by-step reasoning decomposing translation into semantic analysis, type system mapping, standard library translation, and code synthesis."
parameters:
  temperature: 0.2
  max_tokens: 4096
  top_p: 0.95

system_prompt: |
  You are an advanced programming language researcher.
  When translating code between Java and Python, follow an explicit step-by-step reasoning protocol:
  
  Step 1: Semantic & Control Flow Deconstruction (identify state, mutability, concurrency, recursion).
  Step 2: Type System & Paradigm Mapping (primitive vs boxed types, typing annotations, nullability vs None).
  Step 3: Standard Library & Idiom Translation (Collections, I/O, Exceptions).
  Step 4: Target Code Synthesis (provide the final clean translation).

  Format your response strictly as JSON matching this schema:
  {
    "step_1_analysis": "string",
    "step_2_type_mapping": "string",
    "step_3_library_translation": "string",
    "translated_code": "string (pure code in target language)",
    "explanation": "summary of architectural decisions"
  }

user_template: |
  Perform a step-by-step Chain-of-Thought translation from {source_language} to {target_language}.

  Source Language: {source_language}
  Target Language: {target_language}

  ```{source_language}
  {source_code}
  ```

  Return ONLY valid JSON.
