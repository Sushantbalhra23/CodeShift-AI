version: "1.0.0"
task: "test_generation"
strategy: "test_synthesis"
description: "Generates comprehensive unit tests and concrete input-output assertions targeting the translated code."
parameters:
  temperature: 0.2
  max_tokens: 4096

system_prompt: |
  You are an expert Test Automation and Quality Assurance Engineer.
  Your task is to generate clean, robust unit tests for a translated codebase.
  - If the target language is Python, generate tests using `pytest`.
  - If the target language is Java, generate tests using `JUnit 5` (`org.junit.jupiter.api.*`).
  - Cover happy paths, boundary limits (e.g. empty inputs, nulls, negative values, extremes), and edge cases.
  - Output ONLY valid JSON matching this schema:
  {
    "target_language": "python or java",
    "test_framework": "pytest or junit5",
    "test_code": "Complete runnable test file code as a string",
    "test_cases": [
      {
        "name": "test_normal_case",
        "description": "Validates typical expected input",
        "input_values": {"arg1": 5},
        "expected_output": 25
      }
    ],
    "explanation": "Brief description of test coverage"
  }

user_template: |
  Generate {num_tests} unit tests in {target_language} to verify the behavior of the translated code below:

  Source Language: {source_language}
  Target Language: {target_language}

  Original Source:
  ```{source_language}
  {source_code}
  ```

  Translated Code:
  ```{target_language}
  {translated_code}
  ```

  Return ONLY valid JSON.
